name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted Publishing requires npm >= 11.5.1; use latest for reliable OIDC matching.
      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      # setup-node (or a repo secret) exports NODE_AUTH_TOKEN; any value here
      # makes npm use token auth and skip OIDC trusted publishing entirely.
      # Clear it so npm falls back to OIDC.
      - name: Clear NODE_AUTH_TOKEN for OIDC
        run: |
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION, tag: $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag (${GITHUB_REF_NAME}) does not match package.json version (${PKG_VERSION})."
            exit 1
          fi

      - name: Check published version
        id: check
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set +e
          CLEAN_VERSION="${VERSION#v}"
          npm view "oneground@${CLEAN_VERSION}" version >/dev/null 2>&1
          result=$?
          set -e

          if [ "$result" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "oneground@${CLEAN_VERSION} is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "oneground@${CLEAN_VERSION} was not found; publishing will be attempted."
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build --if-present

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Show npm debug log on failure
        if: failure()
        run: cat ~/.npm/_logs/*-debug-*.log 2>/dev/null | tail -n 120
